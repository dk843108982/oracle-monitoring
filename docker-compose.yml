# ============================================================
# Oracle 企业监控 —— Docker Compose 模板（最通用移植方式）
# 用法（目标机安装 Docker + compose）：
#   docker compose up -d
# 说明：
#   - 采集器镜像基于 python:3.12-slim，启动时自动 pip 安装 python-oracledb
#   - oracle-skills 通过 bind mount 挂入容器（放本文件同级的 oracle-skills/ 目录）
#   - 接入真实 Oracle 时：修改 collector/config.json 为 real 模式，
#     并确保容器可访问目标库 1521 端口
# 本模板未在本机验证（当前环境无 Docker），首次使用时请按报错微调。
# ============================================================
services:
  # ============================================================
  # Oracle 真实实例（用于测试，生产环境请替换为真实库地址）
  # 镜像：gvenzl/oracle-free (Oracle 23ai Free Edition)
  # 默认端口 1521，用户 system / oracle
  # ============================================================
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=db_monitor
      - APP_USER_PASSWORD=ChangeMe_2026
    volumes:
      - oracle-db-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--sysdba"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 第二个节点（模拟 RAC Node 2）
  oracle-db2:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db2
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=db_monitor
      - APP_USER_PASSWORD=ChangeMe_2026
    volumes:
      - oracle-db2-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--sysdba"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: oracle-collector
    ports:
      - "127.0.0.1:9161:9161"   # 仅本机暴露，防局域网直读 /metrics（Prometheus 走容器网络不受影响）
    mem_limit: 512m             # 防 OOM（DB2 曾因无限制 OOM 导致授权异常）
    volumes:
      - ./collector/config.json:/app/config.json:ro
      - ./oracle-skills:/app/oracle-skills:ro
      - ./collector/reports:/app/reports
    networks:
      - default
      - rac_pub1_nw   # RAC 集群 SCAN 网络（外部网络，docker network create rac_pub1_nw 预先创建）
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: oracle-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=0.0.0.0:9090
      - --storage.tsdb.retention.time=30d   # TSDB 数据保留 30 天（默认 15 天）
    networks:
      - default
      - rac_pub1_nw   # 采集 RAC 节点 node_exporter(:9100)
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: oracle-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  alert-handler:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: oracle-alert-handler
    entrypoint: ["python", "/app/alert_handler.py", "--port", "8080", "--repo", "/app/oracle-skills"]
    ports:
      - "8080:8080"
    volumes:
      - ./oracle-skills:/app/oracle-skills:ro
      - ./collector/reports:/app/reports
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.2
    container_name: oracle-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ============================================================
  # WatchAlert —— 多数据源告警引擎（替代/补充 Alertmanager）
  # 端口：web 前端 9004，API 9002
  # 首次启动后访问 http://localhost:9004，用初始化密码登录
  # 文档：https://cairry.github.io/docs/
  # ============================================================
  watchalert-mysql:
    image: mysql:8.0
    container_name: oracle-watchalert-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=WatchAlert2026
      - MYSQL_DATABASE=WatchAlert
      - MYSQL_USER=watchalert
      - MYSQL_PASSWORD=WatchAlert2026
    volumes:
      - watchalert-mysql-data:/var/lib/mysql
    restart: unless-stopped

  watchalert-redis:
    image: redis:7-alpine
    container_name: oracle-watchalert-redis
    restart: unless-stopped

  watchalert:
    image: cairry/watchalert:latest
    container_name: oracle-watchalert
    ports:
      - "9002:9001"
    volumes:
      - ./watchalert/config.yaml:/app/config/config.yaml:ro
    environment:
      - MYSQL_HOST=watchalert-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=watchalert
      - MYSQL_PASSWORD=WatchAlert2026
      - MYSQL_DATABASE=WatchAlert
      - REDIS_HOST=watchalert-redis
      - REDIS_PORT=6379
    depends_on:
      - watchalert-mysql
      - watchalert-redis
    restart: unless-stopped

  watchalert-web:
    image: cairry/watchalert-web:latest
    container_name: oracle-watchalert-web
    ports:
      - "9004:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:9002
    depends_on:
      - watchalert
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  watchalert-mysql-data:
  oracle-db-data:
  oracle-db2-data:

networks:
  rac_pub1_nw:
    external: true

