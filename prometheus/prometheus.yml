# Prometheus 主配置 —— Oracle 企业监控
# 组件：oracle_collector(:9161) -> Prometheus -> Grafana(:3000) + Alertmanager(:9093)
global:
  scrape_interval: 15s      # 采集间隔
  evaluation_interval: 15s  # 告警规则评估间隔
  external_labels:
    monitor: oracle-enterprise

rule_files:
  - rules/oracle_alerts.yml
  - rules/oracle_dg_rac_alerts.yml

alerting:
  alertmanagers:
    # 现有 Alertmanager（本地 Webhook → 技能诊断）
    - static_configs:
        - targets: ["alertmanager:9093"]
    # WatchAlert（Docker 部署时启用，负责微信/钉钉/飞书通知）
    # 取消注释并取消缩进即可启用：
    # - static_configs:
    #     - targets: ["watchalert:9001"]
    #   scheme: http
    #   api_version: v2

scrape_configs:
  - job_name: "oracle"
    static_configs:
      - targets: ["collector:9161"]
        labels:
          env: prod
          db: oracle

  # RAC 节点 OS 层监控（node_exporter 部署于 racnode1/racnode2 容器内）
  - job_name: "oracle-node"
    static_configs:
      - targets: ["racnode1:9100", "racnode2:9100"]
        labels:
          env: prod
          db: oracle-rac-os
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: rac_node
        regex: "([^:]+):.*"
        replacement: "$1"
